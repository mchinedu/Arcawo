[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
fs_permissions = [{ access = "read-write", path = "./" }]

remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

[profile.default.fmt]
line_length = 110
tab_width = 4
int_types = "long"
quote_style = "double"

[rpc_endpoints]
arc = "https://rpc.mainnet.arc.io"
arc_testnet = "https://rpc.testnet.arc.io"
anvil = "http://127.0.0.1:8545"

# Verification uses the Arcscan-compatible explorer API (testnet: testnet.arcscan.app).
[etherscan]
arc_testnet = { key = "${BLOCK_EXPLORER_API_KEY}", url = "https://testnet.arcscan.app/api" }
arc = { key = "${BLOCK_EXPLORER_API_KEY}", url = "https://explorer.arc.io/api" }
